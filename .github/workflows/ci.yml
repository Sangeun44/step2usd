name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Convert the sample; the command fails if the result does not match the CAD bounds.
      - run: step2usd convert examples/bracket_assembly.step -o out/bracket.usda --density 7850 --report out/report.json
      # Convert the sample Gaussian splat; fails if the USD does not read back identically.
      - run: step2usd splat examples/bracket_splat.ply -o out/bracket_splat.usdc --report out/splat_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bracket-${{ matrix.os }}
          path: out/
